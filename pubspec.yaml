name: kin
description: "Remember the people who matter, and the small things that make them feel known."
publish_to: "none"
version: 1.0.0-rc1+1

environment:
  sdk: ^3.10.4

dependencies:
  crypto: ^3.0.7
  drift: 2.21.0
  drift_flutter: 0.2.0
  flutter:
    sdk: flutter

  # State management. Reads are streams, writes are notifiers (docs/09).
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  image: ^4.8.0
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^6.2.1
  riverpod_annotation: ^4.0.3
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: 0.5.39
  timezone: ^0.11.1
  uuid: ^4.6.0
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: 2.4.13

  drift_dev: 2.21.0
  flutter_test:
    sdk: flutter

  very_good_analysis: ^9.0.0

flutter:
  # Kin ships its own glyph set (docs/04 §9). The Material icon font is not
  # bundled, which also keeps the release binary smaller.
  uses-material-design: false

  fonts:
    # Voice — human content: names, titles, remembered details.
    # Variable axes: opsz, wght, SOFT, WONK (docs/05 §1).
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf

    # Text — functional content: labels, body, inputs, numerals.
    # Variable axes: opsz, wght.
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf

    # Archive — Journal typewriter. Bundled Courier Prime (OFL).
    # Scoped to Journal writing and archival metadata — not Kin chrome.
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf
