name: kin
description: "Remember the people who matter, and the small things that make them feel known."
publish_to: "none"
version: 1.0.0-rc1+4

environment:
  sdk: ^3.10.4

dependencies:
  crypto: ^3.0.7
  drift: 2.21.0
  drift_flutter: 0.2.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.2.0
  flutter_riverpod: ^3.3.2
  flutter_timezone: ^5.1.0
  go_router: ^17.3.0
  image: ^4.8.0
  image_picker: ^1.2.3
  just_audio: ^0.10.6
  meta: ^1.17.0
  path: ^1.9.1
  path_provider: ^2.1.6
  record: ^6.2.1
  riverpod: ^3.3.2
  riverpod_annotation: ^4.0.3
  screen_retriever: ^0.2.2
  shared_preferences: ^2.5.5
  sqlite3_flutter_libs: 0.5.39
  timezone: ^0.11.1
  uuid: ^4.6.0
  window_manager: ^0.5.1

dev_dependencies:
  build_runner: 2.4.13

  drift_dev: 2.21.0
  flutter_test:
    sdk: flutter

  very_good_analysis: ^9.0.0

flutter:
  # Kin ships its own glyph set (docs/04 §9). The Material icon font is not
  # bundled, which also keeps the release binary smaller.
  uses-material-design: false

  fonts:
    # Secondary — literary / editorial (theme-owned).
    # Variable axes: opsz, wght, SOFT, WONK (docs/05).
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Variable.ttf

    # Universal — product-owned archive / utility across all themes.
    - family: CourierPrime
      fonts:
        - asset: assets/fonts/CourierPrime-Regular.ttf

    # Primary — handwritten personality (Vintage Diary theme-owned).
    # Caveat (OFL) — google/fonts ofl/caveat
    - family: Caveat
      fonts:
        - asset: assets/fonts/Caveat-Variable.ttf

  assets:
    - assets/themes/Vintage-Diary/vintage-bg.webp
    - assets/themes/Vintage-Diary/Journal-Card.webp
    - assets/themes/Vintage-Diary/Calendar.webp
    - assets/themes/Vintage-Diary/bottom-navbar.webp
    - assets/themes/Vintage-Diary/user-strip.webp
    - assets/themes/Vintage-Diary/search.webp
    - assets/themes/Vintage-Diary/profile_card.webp
    - assets/themes/Vintage-Diary/Mood-Illustrations/
    - assets/themes/Neon-Arcade/arcade-bg.webp
    - assets/themes/Neon-Arcade/Journal-card.webp
    - assets/themes/Neon-Arcade/Calendar.webp
    - assets/themes/Neon-Arcade/bottom-navbar.webp
    - assets/themes/Neon-Arcade/user-strip.webp
    - assets/themes/Neon-Arcade/profile_card.webp
    - assets/themes/Neon-Arcade/Mood-Illustrations/
